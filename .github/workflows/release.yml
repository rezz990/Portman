name: Windows release candidate
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate version and release tag
        shell: pwsh
        run: |
          python scripts/version.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match VERSION (v$version)."
          }
      - name: Install pinned Zig
        run: python -m pip install ziglang==0.14.1
      - name: Check formatting
        run: python -m ziglang fmt --check build.zig src/main.zig src/config.zig src/desktop.zig windows/setup.zig
      - name: Release tooling tests
        run: python -m unittest discover -s tests -p test_release.py
      - name: Engine tests
        run: python -m ziglang build test-desktop
      - name: Build and verify release bundle
        run: python scripts/build_windows.py
      - name: CLI integration tests on Windows
        run: python tests/integration.py dist/windows-release/bin/portman-cli.exe
      - name: Upload reviewable release files
        uses: actions/upload-artifact@v7
        with:
          name: portman-windows-release
          path: dist/release/
          if-no-files-found: error
      - name: Prepare draft release for owner review
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/Portman-Setup-*.exe
            dist/release/Portman-*-windows-x64.zip
            dist/release/Portman-*-source.zip
            dist/release/BUILD-INFO.json
            dist/release/SHA256SUMS.txt
